<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Definições -->
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF3D30"/>
      <stop offset="100%" style="stop-color:#EE1105"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fundo circular -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)" filter="url(#shadow)"/>

  <!-- Caminho da rota - linha principal branca -->
  <path d="M 90 400
           Q 120 370, 110 330
           Q 100 290, 140 270
           Q 180 250, 160 210
           Q 140 170, 190 150
           Q 240 130, 256 80
           Q 272 130, 322 150
           Q 372 170, 352 210
           Q 332 250, 372 270
           Q 412 290, 402 330
           Q 392 370, 422 400"
        fill="none" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Caminho secundário vermelho escuro -->
  <path d="M 90 400
           Q 120 370, 110 330
           Q 100 290, 140 270
           Q 180 250, 160 210
           Q 140 170, 190 150
           Q 240 130, 256 80
           Q 272 130, 322 150
           Q 372 170, 352 210
           Q 332 250, 372 270
           Q 412 290, 402 330
           Q 392 370, 422 400"
        fill="none" stroke="#C80A05" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pontos de parada ao longo da rota -->
  <g fill="white" stroke="#EE1105" stroke-width="3">
    <circle cx="90" cy="400" r="18"/>
    <circle cx="140" cy="270" r="18"/>
    <circle cx="190" cy="150" r="18"/>
    <circle cx="322" cy="150" r="18"/>
    <circle cx="372" cy="270" r="18"/>
    <circle cx="422" cy="400" r="18"/>
  </g>

  <!-- Pontos internos vermelhos -->
  <g fill="#EE1105">
    <circle cx="90" cy="400" r="8"/>
    <circle cx="140" cy="270" r="8"/>
    <circle cx="190" cy="150" r="8"/>
    <circle cx="322" cy="150" r="8"/>
    <circle cx="372" cy="270" r="8"/>
    <circle cx="422" cy="400" r="8"/>
  </g>

  <!-- Pin de localização no centro -->
  <g transform="translate(256, 200)">
    <!-- Sombra -->
    <ellipse cx="0" cy="60" rx="25" ry="10" fill="rgba(0,0,0,0.3)"/>

    <!-- Pin branco -->
    <circle cx="0" cy="0" r="45" fill="white" stroke="#EE1105" stroke-width="4"/>

    <!-- Pin vermelho interno -->
    <circle cx="0" cy="0" r="32" fill="#EE1105"/>

    <!-- Letra M -->
    <text x="0" y="12" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-weight="bold" font-size="32">M</text>

    <!-- Triângulo do pin -->
    <polygon points="0,55 -22,25 22,25" fill="white"/>
  </g>

  <!-- Brilho decorativo no topo -->
  <ellipse cx="256" cy="60" rx="40" ry="15" fill="white" opacity="0.4"/>
</svg>
