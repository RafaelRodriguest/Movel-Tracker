name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 8 * * 1'  # toda segunda-feira às 8h UTC (5h horário de Brasília)
  workflow_dispatch:       # permite rodar manualmente se necessário

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/sites?select=site_id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Status HTTP: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "AVISO: Supabase retornou $STATUS — verificar se o projeto está ativo."
            exit 1
          fi
          echo "Supabase respondendo normalmente."
