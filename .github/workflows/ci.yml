name: CI

# Roda analyze e os testes do Flutter a cada push/PR, pra pegar erro antes
# de chegar no main. Ver CLAUDE.md, seção "Fluxo de Desenvolvimento e CI".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable'
          cache: true

      - name: Gerar env.dart / env_dev.dart (gitignored, vêm de secrets)
        env:
          ENV_DART_CONTENT: ${{ secrets.ENV_DART_CONTENT }}
          ENV_DEV_DART_CONTENT: ${{ secrets.ENV_DEV_DART_CONTENT }}
        run: |
          mkdir -p lib/config
          printf '%s' "$ENV_DART_CONTENT" > lib/config/env.dart
          printf '%s' "$ENV_DEV_DART_CONTENT" > lib/config/env_dev.dart

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar código
        run: flutter analyze

      - name: Rodar testes
        run: flutter test
