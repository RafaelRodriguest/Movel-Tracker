name: Keep Supabase projects alive

# Free tier do Supabase pausa projetos após 7 dias sem requisições.
# Este workflow faz um SELECT trivial em produção e dev todo dia
# só pra contar como atividade e evitar a pausa automática.
# Ver CLAUDE.md, seção "Ambiente de desenvolvimento".

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping produção
        run: |
          curl -sf "${{ secrets.SUPABASE_PROD_URL }}/rest/v1/sites?select=site_id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_PROD_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_PROD_ANON_KEY }}" \
            -o /dev/null

      - name: Ping dev
        run: |
          curl -sf "${{ secrets.SUPABASE_DEV_URL }}/rest/v1/sites?select=site_id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_DEV_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_DEV_ANON_KEY }}" \
            -o /dev/null
