name: Keep Supabase projects alive

# Free tier do Supabase pausa projetos após 7 dias sem requisições.
# Este workflow faz um INSERT trivial em produção e dev todo dia
# só pra contar como atividade e evitar a pausa automática. Um SELECT
# não estava resetando o contador de inatividade de forma confiável.
# Ver CLAUDE.md, seção "Ambiente de desenvolvimento".

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping produção
        run: |
          curl -sf "${{ secrets.SUPABASE_PROD_URL }}/rest/v1/keepalive_ping" \
            -H "apikey: ${{ secrets.SUPABASE_PROD_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_PROD_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{}" \
            -o /dev/null

      - name: Ping dev
        run: |
          curl -sf "${{ secrets.SUPABASE_DEV_URL }}/rest/v1/keepalive_ping" \
            -H "apikey: ${{ secrets.SUPABASE_DEV_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_DEV_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{}" \
            -o /dev/null
